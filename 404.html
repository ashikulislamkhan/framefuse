<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameFuse</title>
<script>
  // GitHub Pages serves this file for unknown paths such as /<repo>/frame/<slug>.
  // Park the requested path, then open the app root; the app restores the clean URL.
  (function () {
    var m = location.pathname.match(/^(.*\/)frame\/[^/]+\/?$/);
    if (!m) return;
    try { sessionStorage.setItem("ff:deeplink", location.pathname); } catch (e) {}
    location.replace(m[1]);
  })();
</script>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #e3f5f6; color: #0c2a2e; text-align: center; }
  a { color: #0b8794; font-weight: 600; }
</style>
</head>
<body><main><h1>Page not found</h1><p><a href="/">Return Home</a></p></main></body>
</html>
